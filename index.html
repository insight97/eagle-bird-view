<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Bird View</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="bird-view-core.js"></script>
    <script src="media-load-queue.js"></script>
    <script src="exploration-source.js"></script>
    <script src="video-player.js"></script>
    <script src="tag-editor.js"></script>
    <script src="plugin.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="brand" aria-label="Bird View">
          <span class="brand-mark">B</span>
          <span>Bird View</span>
        </div>

        <div id="selection-status" class="selection-status" role="status" aria-live="polite">
          <span id="selection-empty" class="selection-empty">未選取素材</span>
          <div id="selection-details" class="selection-details" hidden>
            <span id="selection-rating" class="media-rating selection-rating" aria-label="評分 0 顆星"></span>
            <span id="selection-tags-divider" class="selection-divider" aria-hidden="true"></span>
            <span id="selection-tags" class="media-tags selection-tags"></span>
            <span id="selection-folders-divider" class="selection-divider" aria-hidden="true"></span>
            <span id="selection-folders" class="selection-folders"></span>
            <span id="selection-name-divider" class="selection-divider" aria-hidden="true"></span>
            <span id="selection-name" class="selection-name"></span>
            <span id="selection-dimensions-divider" class="selection-divider" aria-hidden="true"></span>
            <span id="selection-dimensions" class="media-dimensions selection-dimensions"></span>
          </div>
        </div>

        <div class="toolbar-meta">
          <button
            id="seamless-mode-toggle"
            class="mode-toggle"
            type="button"
            role="switch"
            aria-checked="false"
            title="開啟無縫模式（Del）"
          >
            <span>無縫</span>
            <span class="mode-toggle-track" aria-hidden="true">
              <span class="mode-toggle-knob"></span>
            </span>
            <span id="seamless-mode-status" class="mode-toggle-status">關</span>
          </button>
          <div class="auto-explore-controls">
            <button
              id="auto-explore-toggle"
              class="mode-toggle"
              type="button"
              role="switch"
              aria-checked="false"
              disabled
            >
              <span>自動探索</span>
              <span class="mode-toggle-track" aria-hidden="true">
                <span class="mode-toggle-knob"></span>
              </span>
              <span id="auto-explore-status" class="mode-toggle-status">關</span>
            </button>
            <button
              id="auto-explore-settings-button"
              class="settings-button"
              type="button"
              aria-label="設定自動探索與白板選項"
              aria-expanded="false"
              disabled
            >
              ⚙
            </button>
            <div
              id="auto-explore-settings-panel"
              class="auto-explore-settings"
              role="dialog"
              aria-label="自動探索條件"
              hidden
            >
              <div class="auto-explore-settings-heading">自動探索條件</div>
              <div class="auto-explore-setting-row">
                <span>檔案類型</span>
                <div class="auto-explore-file-type-options" role="group" aria-label="檔案類型">
                  <label class="auto-explore-file-type-option">
                    <input id="auto-explore-file-type-image" type="checkbox" value="image" checked />
                    <span>圖片</span>
                  </label>
                  <label class="auto-explore-file-type-option">
                    <input id="auto-explore-file-type-video" type="checkbox" value="video" checked />
                    <span>影片</span>
                  </label>
                </div>
              </div>
              <label class="auto-explore-setting-row">
                <span>評分</span>
                <select id="auto-explore-rating" class="auto-explore-select">
                  <option value="unrated">未評分</option>
                  <option value="any">不限</option>
                  <option value="1">1 星</option>
                  <option value="2">2 星</option>
                  <option value="3">3 星</option>
                  <option value="4">4 星</option>
                  <option value="5">5 星</option>
                </select>
              </label>
              <label class="auto-explore-setting-row">
                <span>Tag 匹配</span>
                <select id="auto-explore-tag-match" class="auto-explore-select">
                  <option value="any">符合任一個</option>
                  <option value="all">全部符合</option>
                </select>
              </label>
              <label class="auto-explore-setting-row auto-explore-count-row">
                <span>Tag 數量小於</span>
                <input
                  id="auto-explore-max-tag-count"
                  class="auto-explore-number"
                  type="number"
                  min="1"
                  step="1"
                  inputmode="numeric"
                  placeholder="不限"
                />
              </label>
              <div class="auto-explore-tag-search-label">
                <span>指定 Tag</span>
                <div class="auto-explore-tag-picker">
                  <input
                    id="auto-explore-tag-search"
                    class="auto-explore-tag-search"
                    type="search"
                    placeholder="搜尋 Tag"
                  />
                  <div id="auto-explore-tag-options" class="auto-explore-tag-options" hidden></div>
                </div>
              </div>
              <div class="auto-explore-tag-hint">不選任何 Tag 代表不限 Tag</div>
              <div id="auto-explore-selected-tags" class="auto-explore-selected-tags" hidden></div>
              <div class="auto-explore-tag-search-label">
                <span>排除 Tag</span>
                <div class="auto-explore-tag-picker">
                  <input
                    id="auto-explore-excluded-tag-search"
                    class="auto-explore-tag-search"
                    type="search"
                    placeholder="搜尋要排除的 Tag"
                  />
                  <div
                    id="auto-explore-excluded-tag-options"
                    class="auto-explore-tag-options"
                    hidden
                  ></div>
                </div>
              </div>
              <div class="auto-explore-tag-hint">含有任一排除 Tag 的素材不會被探索</div>
              <div
                id="auto-explore-selected-excluded-tags"
                class="auto-explore-selected-tags"
                hidden
              ></div>
              <div class="auto-explore-settings-section-heading">白板選項</div>
              <label class="auto-explore-setting-row">
                <span>排列方向</span>
                <select id="board-layout-direction" class="auto-explore-select">
                  <option value="ltr">由左至右</option>
                  <option value="rtl">由右至左</option>
                </select>
              </label>
              <div class="auto-explore-setting-row auto-explore-speed-row">
                <span>每列最大寬度</span>
                <div class="auto-explore-speed-control">
                  <input
                    id="board-layout-width"
                    class="auto-explore-range"
                    type="range"
                    min="240"
                    max="2400"
                    step="40"
                    value="1200"
                  />
                  <output
                    id="board-layout-width-value"
                    class="auto-explore-layout-width-value"
                    for="board-layout-width"
                  >
                    1200 px
                  </output>
                </div>
              </div>
              <div class="auto-explore-setting-row auto-explore-speed-row">
                <span>每次探索最多</span>
                <div class="auto-explore-speed-control">
                  <input
                    id="board-exploration-max-items"
                    class="auto-explore-range"
                    type="range"
                    min="3"
                    max="50"
                    step="1"
                    value="12"
                  />
                  <output
                    id="board-exploration-max-items-value"
                    class="auto-explore-exploration-limit-value"
                    for="board-exploration-max-items"
                  >
                    12 個
                  </output>
                </div>
              </div>
              <div class="auto-explore-settings-subheading">移動</div>
              <label class="auto-explore-setting-row">
                <span>平滑移動</span>
                <input id="smooth-pan-toggle" type="checkbox" />
              </label>
              <div class="auto-explore-setting-row auto-explore-speed-row">
                <span>移動速度</span>
                <div class="auto-explore-speed-control">
                  <input
                    id="smooth-pan-speed"
                    class="auto-explore-range"
                    type="range"
                    min="120"
                    max="3000"
                    step="20"
                    value="480"
                  />
                  <output id="smooth-pan-speed-value" class="auto-explore-speed-value" for="smooth-pan-speed">
                    480
                  </output>
                </div>
              </div>
              <div class="auto-explore-settings-subheading">縮放</div>
              <label class="auto-explore-setting-row">
                <span>平滑縮放</span>
                <input id="smooth-zoom-toggle" type="checkbox" />
              </label>
              <div class="auto-explore-setting-row auto-explore-speed-row">
                <span>縮放速度</span>
                <div class="auto-explore-speed-control">
                  <input
                    id="smooth-zoom-speed"
                    class="auto-explore-range"
                    type="range"
                    min="1.05"
                    max="12"
                    step="0.05"
                    value="1.5"
                  />
                  <output
                    id="smooth-zoom-speed-value"
                    class="auto-explore-zoom-speed-value"
                    for="smooth-zoom-speed"
                  >
                    1.50×/秒
                  </output>
                </div>
              </div>
              <div class="auto-explore-settings-footer">
                <button id="auto-explore-settings-reset" class="tag-editor-button" type="button">
                  預設
                </button>
              </div>
            </div>
          </div>
          <button id="explore-button" class="explore-button" type="button" disabled>探索下一列</button>
          <span class="divider" aria-hidden="true"></span>
          <span id="item-count">0 個素材</span>
          <span class="divider" aria-hidden="true"></span>
          <span id="zoom-label">100%</span>
        </div>
      </header>

      <section id="viewport" class="viewport" aria-label="媒體白板">
        <div id="grid" class="grid-layer" aria-hidden="true"></div>
        <div id="world" class="world"></div>
        <div id="labels" class="labels-layer"></div>

        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">＋</div>
          <h1>從 Eagle 加入素材</h1>
          <p>請先在 Eagle 選取圖片或影片，再重新開啟 Bird View。</p>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
